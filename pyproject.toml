[project]
name = "async-amazon-ads-api-v1"
dynamic = ["version"]
description = "Pure async Amazon Ads API client — v0 and v1 (SP, SB, SD, DSP, ST, and more)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jack", email = "zhangwenguang@apollosuite.com" }]
keywords = ["amazon", "ads", "ads-api", "advertising", "sponsored-products", "sponsored-brands", "sponsored-display", "async", "api-v1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.urls]
Homepage = "https://github.com/apollosuite/async_amazon_ads_api_v1"
Repository = "https://github.com/apollosuite/async_amazon_ads_api_v1"
Issues = "https://github.com/apollosuite/async_amazon_ads_api_v1/issues"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "black>=26.3.1",
    "pyrefly>=1.0.0",
    "hatchling>=1.21.0",
    "twine>=6.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ads_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_api"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".dist",
    "dist",
    "docs",
    "codegen",
    "tests",
    "AGENTS.md",
    "uv.lock",
    ".idea",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/ads_api/models/**" = ["E501", "F403", "N815"]
"src/ads_api/client/**" = ["E501"]
"codegen/v0/codegen/*" = ["E501"]
"codegen/v1/codegen/*" = ["E501"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: tests that call a live ads_v1_server over HTTP",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = [
]

[tool.pyrefly]
project-excludes = [
]
python-version = "3.13.0"
preset = "legacy"
